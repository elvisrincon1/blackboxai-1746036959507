<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión - Plataforma de Afiliados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">
  <main class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
    <h1 class="text-3xl font-semibold mb-6 text-gray-800">Iniciar Sesión</h1>
    <form id="login-form" class="space-y-6" novalidate>
      <div>
        <label for="usuario" class="block text-gray-600 mb-1">Usuario:</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          required
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="Ingrese su usuario"
        />
      </div>
      <div>
        <label for="contrasena" class="block text-gray-600 mb-1">Contraseña:</label>
        <input
          type="password"
          id="contrasena"
          name="contrasena"
          required
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
          placeholder="Ingrese su contraseña"
        />
      </div>
      <button
        type="submit"
        class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-md hover:bg-indigo-700 transition"
      >
        Iniciar Sesión
      </button>
    </form>
    <p id="error-message" class="text-red-600 mt-4 hidden">Usuario o contraseña incorrectos.</p>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    // Simulated user database with roles
    const users = {
      master: { password: 'master123', role: 'master' },
      supervisor: { password: 'supervisor123', role: 'supervisor' },
      afiliado: { password: 'afiliado123', role: 'afiliado' }
    };

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = loginForm.usuario.value.trim();
      const password = loginForm.contrasena.value.trim();

      if (users[username] && users[username].password === password) {
        const role = users[username].role;
        // Redirect based on role
        if (role === 'master') {
          window.location.href = 'master.html';
        } else if (role === 'supervisor') {
          window.location.href = 'supervisor.html';
        } else if (role === 'afiliado') {
          window.location.href = 'afiliado.html';
        }
      } else {
        errorMessage.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
